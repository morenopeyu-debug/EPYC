# =====================================================================
# Configuración de Apache para el despliegue público.
#
# La idea de fondo: la raíz del proyecto es también la raíz del sitio,
# así que hay carpetas y archivos que quedarían descargables por HTTP si
# no se bloquean explícitamente. Un GET a /sql/neon/03_catalogo_base.sql
# entregaría el esquema completo y los hashes de las contraseñas.
# =====================================================================

# No anunciar versión de Apache ni del sistema en las cabeceras ni en las
# páginas de error.
ServerTokens Prod
ServerSignature Off

# Evita la advertencia "could not reliably determine the server's fully
# qualified domain name" en cada arranque.
ServerName localhost

<Directory /var/www/html>
    # -Indexes: sin listados automáticos de directorio.
    Options -Indexes +FollowSymLinks
    AllowOverride None
    Require all granted
    DirectoryIndex index.php index.html
</Directory>

# Carpetas que nunca deben servirse: lib/ son clases que se incluyen
# desde PHP, sql/ y docker/ no tienen nada que hacer en la web.
<DirectoryMatch "^/var/www/html/(lib|sql|docker)">
    Require all denied
</DirectoryMatch>

# Archivos por extensión: volcados SQL, documentación, configuración y
# scripts. Nada de esto se sirve como descarga.
<FilesMatch "\.(sql|md|ini|sh|ya?ml|log|bak|dist|example)$">
    Require all denied
</FilesMatch>

# Y por nombre, lo que sí es PHP pero no es una página.
<FilesMatch "^(config\.local\.php|config\.local\.example\.php|generar_hash\.php|Dockerfile|\.dockerignore|\.gitignore)$">
    Require all denied
</FilesMatch>

# Cabeceras de seguridad básicas.
<IfModule mod_headers.c>
    # Impide que el navegador adivine el tipo de contenido.
    Header always set X-Content-Type-Options "nosniff"
    # La página no se puede embeber en un iframe ajeno (clickjacking).
    Header always set X-Frame-Options "SAMEORIGIN"
    Header always set Referrer-Policy "strict-origin-when-cross-origin"
    # Render sirve por HTTPS; esto le dice al navegador que no vuelva a
    # intentar por HTTP durante los próximos 6 meses.
    Header always set Strict-Transport-Security "max-age=15552000"
    # Ya no hace falta anunciar que el sitio corre sobre PHP.
    Header always unset X-Powered-By
</IfModule>
