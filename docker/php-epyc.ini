; =====================================================================
; Ajustes de PHP para el contenedor de producción.
; Se cargan al final (prefijo zz-) para ganarle a php.ini-production.
; =====================================================================

; No revelar la versión de PHP en la cabecera X-Powered-By.
expose_php = Off

; Los errores NUNCA se imprimen en la página: un error de PDO mostraría
; el host y el usuario de la base de datos al visitante. Van al log del
; contenedor, que es donde Render los recoge.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr

; Sesiones: la cookie también se endurece desde bootstrap.php; esto es
; la red de seguridad por si alguna ruta arranca la sesión antes.
session.cookie_httponly = 1
session.cookie_samesite = "Lax"
session.use_strict_mode = 1

; El negocio opera en México. Coincide con dbo.ahora() en Postgres, que
; es lo que decide qué cuenta como "ventas de hoy".
date.timezone = "America/Mexico_City"

; Esta aplicación no recibe archivos; no hay razón para aceptar subidas.
file_uploads = Off
post_max_size = 1M

memory_limit = 128M
max_execution_time = 30
